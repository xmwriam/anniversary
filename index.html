 let d=0;const p=v=>{const r=cv.getBoundingClientRect();x.globalCompositeOperation="destination-out";x.beginPath();x.arc((v.clientX-r.left)*300/r.width,(v.clientY-r.top)*110/r.height,18,0,7);x.fill()};
 cv.onpointerdown=v=>{d=1;cv.setPointerCapture(v.pointerId);p(v)};cv.onpointermove=v=>d&&p(v);
 cv.onpointerup=()=>{d=0;const a=x.getImageData(0,0,300,110).data;let c=0;for(let i=3;i<a.length;i+=64)if(!a[i])c++;if(c>a.length/64*.45)cv.style.opacity=0}}
function hol(e){let r=0,sc=0;const g=$(".g",e);
 const show=()=>{if(r>=HL.length){g.innerHTML=`<div class=big>${sc}/${HL.length}</div><div class=c>${sc>2?"You know us too well.":"Not bad. Still learning us."}</div>`;return}const[a,av,b]=HL[r];g.innerHTML=`<div class=c>${a}: <b>${fmt(av)}</b></div><div class=mid>Is ${b} higher or lower?</div><button class=o data-v=1>Higher</button><button class=o data-v=0>Lower</button><div class=c></div>`};
 g.onclick=v=>{const b=v.target.closest("[data-v]");if(!b||g.dataset.l)return;g.dataset.l=1;const[,av,n,bv]=HL[r],ok=(bv>av)==(b.dataset.v==1);if(ok)sc++;b.classList.add(ok?"ok":"no");g.lastElementChild.textContent=`${n}: ${fmt(bv)} ${ok?"✓":"✗"}`;setTimeout(()=>{r++;g.dataset.l="";show()},1600)};show()}
function gs(e){let r=0,sc=0;const g=$(".g",e),L=CFG.senders;
 const show=()=>{if(r>=L.length){g.innerHTML=`<div class=big>${sc}/${L.length}</div><div class=c>Who knows our words best?</div>`;return}g.innerHTML=`<div class=mid>“${L[r][0]}”</div><div class=k>Who sent it?</div><button class=o data-v=1>${him}</button><button class=o data-v=0>${me}</button><div class=c></div>`};
 g.onclick=v=>{const b=v.target.closest("[data-v]");if(!b||g.dataset.l)return;g.dataset.l=1;const ok=+b.dataset.v==L[r][1];if(ok)sc++;b.classList.add(ok?"ok":"no");g.lastElementChild.textContent=ok?"Yes!":"Not quite.";setTimeout(()=>{r++;g.dataset.l="";show()},1400)};show()}
function wheel(e){const cv=$("canvas",e),x=cv.getContext("2d"),P=CFG.prizes,n=P.length,a=2*Math.PI/n,C=["#ffd23f","#ff6b9d","#7cf5d4","#9b8cff","#ff9a3c","#8de14d"];cv.width=cv.height=300;
 P.forEach((p,i)=>{x.beginPath();x.moveTo(150,150);x.arc(150,150,148,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);x.fillStyle=C[i%C.length];x.fill();x.strokeStyle="#fff";x.lineWidth=3;x.stroke();x.save();x.translate(150,150);x.rotate(-Math.PI/2+(i+.5)*a);x.fillStyle="#1b0b2e";x.font="800 13px system-ui,sans-serif";x.textAlign="right";x.fillText(p.slice(0,24),138,4);x.restore()});
 let rot=0;$("button",e).onclick=()=>{rot+=1440+Math.random()*360;cv.style.transform=`rotate(${rot}deg)`;$(".c",e).textContent="Spinning…"};
 cv.addEventListener("transitionend",()=>{$(".c",e).textContent="🎁 "+P[Math.floor(((360-rot%360)%360)/(360/n))];conf(e)})}
let asked=0,on=false,ai=0,trk="",AC;const AU=[new Audio(),new Audio()],mb=document.createElement("button");
AU.forEach(a=>{a.loop=true;a.volume=0});mb.id="mb";mb.textContent="🔇";mb.setAttribute("aria-label","Toggle music");mb.hidden=!CFG.music.length;app.appendChild(mb);
function fade(a,to){const f=a.volume,t0=performance.now();requestAnimationFrame(function s(t){const p=Math.min(1,(t-t0)/1200);a.volume=f+(to-f)*p;if(p<1)requestAnimationFrame(s);else if(!to)a.pause()})}
function syn(k){syn.stop&&syn.stop();const g=AC.createGain();g.gain.value=0;g.connect(AC.destination);g.gain.linearRampToValueAtTime(.16,AC.currentTime+2);
 const tr=2**([0,2,-3,4,-1,5][k%6]/12),P=[[261.63,329.63,392,493.88],[220,261.63,329.63,392],[174.61,220,261.63,329.63],[196,246.94,293.66,392]],dt=[4,3,5,3.5,4,3][k%6];let n=0;
 const play=()=>{const t=AC.currentTime,ch=P[n++%4];ch.forEach((f,j)=>{const o=AC.createOscillator(),e=AC.createGain();o.type=j%2?"triangle":"sine";o.frequency.value=f*tr*(j==3?2:1);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.5/ch.length,t+dt*.35);e.gain.linearRampToValueAtTime(0,t+dt*1.2);o.connect(e);e.connect(g);o.start(t);o.stop(t+dt*1.25)})};
 play();const id=setInterval(play,dt*1000);syn.stop=()=>{clearInterval(id);g.gain.linearRampToValueAtTime(0,AC.currentTime+1.2);setTimeout(()=>g.disconnect(),1500);syn.stop=null}}
function mus(i){if(!on)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const m=[...CFG.music].reverse().find(x=>x[0]<=i);if(!m||m[1]==trk)return;trk=m[1];fade(AU[ai],0);syn.stop&&syn.stop();ai^=1;const a=AU[ai],k=CFG.music.indexOf(m);a.src=m[1];a.play().then(()=>fade(a,.5)).catch(()=>syn(k))}
mb.onclick=()=>{on=!on;mb.textContent=on?"🔊":"🔇";if(on){trk="";mus(cur)}else{AU.forEach(a=>fade(a,0));syn.stop&&syn.stop()}};
document.addEventListener("visibilitychange",()=>{if(document.hidden){AU[ai].pause();AC&&AC.suspend()}else if(on&&trk){AU[ai].play().catch(()=>{});AC&&AC.resume()}});
function conf(e){for(let i=0;i<28;i++){const f=document.createElement("i");f.className="cf";f.textContent=["💖","✨","💜","🎉"][i%4];f.style.cssText=`left:${Math.random()*100}%;--w:${Math.random()*1.2}s;--r:${Math.random()*360}deg;font-size:${14+Math.random()*16}px`;e.appendChild(f);setTimeout(()=>f.remove(),4500)}}
go(0);
</script></body></html>
